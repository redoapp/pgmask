name: Publish image

# Publishes the release binary as a container image to GHCR.
#
# Deliberately separate from release.yml: that file is regenerated by
# `dist init`, so anything added to it is lost on the next cargo-dist bump.
#
# This does not compile pgmask. It downloads the archive the release job
# already built and attested, verifies it against the release's own `.sha256`,
# and copies the binary into deploy/release.Dockerfile. Rebuilding here would
# ship a binary with a different profile than the one that was tested.
on:
  release:
    types: [published]
  # Backfill an image for a release that predates this workflow, or re-publish
  # after a registry-side failure. The tag must already exist.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.2.13
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  ARCHIVE: pgmask-x86_64-unknown-linux-gnu.tar.xz
  IMAGE: ghcr.io/redoapp/pgmask

jobs:
  publish:
    name: publish ${{ github.event.release.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the tag and version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::tag '$TAG' is not a vN.N.N release tag" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"

      - name: Download and verify the release archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p stage
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARCHIVE" --pattern "$ARCHIVE.sha256" --dir .
          # The published .sha256 is `<hex> *<name>`; sha256sum -c reads that
          # directly, so a mismatch fails here rather than shipping.
          sha256sum -c "$ARCHIVE.sha256"
          tar -xJf "$ARCHIVE" -C stage --strip-components=1
          test -x stage/pgmask

      - name: Check the binary matches the tag
        run: |
          set -euo pipefail
          # Guards the backfill path: a hand-typed tag that names a different
          # release would otherwise publish a mislabelled image.
          reported=$(./stage/pgmask --version | awk '{print $2}')
          expected='${{ steps.version.outputs.version }}'
          if [ "$reported" != "$expected" ]; then
            echo "::error::archive reports pgmask $reported, tag says $expected" >&2
            exit 1
          fi

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker build \
            -f deploy/release.Dockerfile \
            -t "$IMAGE:$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=MIT" \
            stage
          docker push "$IMAGE:$VERSION"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION" | cut -d@ -f2)
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Report the pinnable reference
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "Pin this in redotech-infra as \`waypointMaskedPgmaskImage\`:"
            echo
            echo '```'
            echo "$IMAGE:$VERSION@$DIGEST"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
