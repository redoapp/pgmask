name: CI

# PR CI is the static policy plus real-Postgres (two majors) and the TLS
# suite. Generated SQL, Cockroach, mutants, and sqlsmith stay on
# ./scripts/test-all.sh for a release.
#
# Caching: a top-level `permissions: contents: read` zeroes every other
# GITHUB_TOKEN scope, including `actions`. rust-cache then cannot *save*,
# so every job compiled from a cold crates.io with a cache that only ever
# restored nothing. `actions: write` is the scope the cache API needs.
# Compilation units are sccache (GitHub backend). rust-cache holds the
# registry, keyed by profile not job id, so Postgres 14 and 17 share it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2
          fallback: none

      - run: cargo fmt --all --check
      - run: cargo deny --all-features --locked check --hide-inclusion-graph
      - run: cargo deny --manifest-path fuzz/Cargo.toml --all-features --locked check --hide-inclusion-graph
      - run: cargo machete
      - run: ./scripts/check-repo-invariants.sh

  lint:
    name: clippy and rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache-key: debug
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - run: cargo test --workspace --all-features --doc --locked
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  test:
    name: tests (Postgres ${{ matrix.pg }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: "17"
            image: postgres:17@sha256:a65e6a841f6c4dbc4abda3d67fa3bc21824e9611064fcd82e87ea67aad60a0c3
            save-cache: "true"
          - pg: "14"
            image: postgres:14
            save-cache: "false"
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: debug
          save-cache: ${{ matrix.save-cache }}
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest@0.9.143
          fallback: none

      - name: tests
        env:
          PGMASK_TEST_PG: 127.0.0.1:5432
        run: cargo nextest run --workspace --all-features --locked --profile ci
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  tls:
    name: TLS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release
      - name: psql
        run: |
          if ! command -v psql >/dev/null; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              postgresql-client
          fi
      - name: TLS suite
        env:
          CONTAINER_ENGINE: docker
        run: ./scripts/test-tls.sh
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
