[workspace]
resolver = "2"
members = ["crates/spike", "crates/proxy", "crates/bench", "crates/corpus",
    "crates/fuzz", "crates/classify"]
# The libFuzzer target. It has its own `[workspace]`, so this is belt and
# braces — but it says out loud that `libfuzzer-sys`, its C++ runtime and the
# `arbitrary` derive are not in this graph. Nothing under `fuzz/` is built,
# tested or audited by any command run at this root.
exclude = ["fuzz"]

[profile.release]
# Arithmetic that overflows wraps silently in release by default. This binary
# decodes attacker-influenced bytes and does date and bucket arithmetic on
# them, and fuzzing already found an overflow in `floor_to` at i64::MIN — that
# one was caught because the debug build panicked. Paying a few percent to make
# the release build behave the same way is the right trade for a masking proxy:
# a panic kills one session, a wrapped integer silently masks the wrong value.
overflow-checks = true

# The profile that 'dist' will build with.
# Thin LTO left a 23 MiB unstripped ELF (18 MiB after `strip --strip-unneeded`).
# Most of .text is libpg_query's bison tables plus sqlparser (lineage) and
# ring. Fat LTO + one codegen unit lets LLVM drop more of that; strip removes
# the symbol table operators do not need. Keep unwind and overflow-checks:
# a panic still kills one session, and wrapping integer arithmetic is how
# floor_to silently masked the wrong value.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[workspace.lints.rust]
# Zero today, and there is no reason for this crate ever to need it.
unsafe_code = "forbid"

[workspace.lints.clippy]
# Both are already zero in the library and binaries. Denying them costs nothing
# now and stops the first one arriving unnoticed on a path where a panic takes
# out a live session.
unwrap_used = "deny"
panic = "deny"
# 50 and 31 hits respectively, all in code that parses untrusted bytes, so
# each one is a potential panic or a silent wrap. Too many to fix in one go;
# warn keeps them visible rather than pretending they are not there.
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[workspace.package]
version = "0.2.3"
edition = "2021"
rust-version = "1.97"
license = "MIT"
publish = false
repository = "https://github.com/redoapp/pgmask"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"
toml = "1.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-postgres-rustls = "0.14"
webpki-roots = "1"
governor = "0.10"
pg_query = "6"
proptest = "1"
jiff = "0.2"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
postgres-types = { version = "0.2", features = ["with-jiff-0_2"] }
