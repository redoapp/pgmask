[workspace]
members = ["cargo:."]

# Config for 'dist'. Cargo `publish = false` is correct (application, not a
# crates.io library). `packages` plus per-crate `dist = true` still ships
# the operator binaries on GitHub Releases.
[dist]
# release.yml deliberately narrows cargo-dist's workflow-wide contents:write
# to the host job that publishes the release. Keep CI generation unmanaged so
# `dist plan` accepts that security boundary and `dist init` cannot erase it.
allow-dirty = ["ci"]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Where to host releases
hosting = "github"
# The installers to generate for each app
installers = ["shell"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Which actions to run on pull requests
pr-run-mode = "plan"
# Whether to enable GitHub Attestations
github-attestations = true
# Target platforms to build apps for (Rust target-triple syntax). macOS is
# Apple Silicon only; Intel macOS users can build from source.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Lockstep workspace version, but only these two crates are shippable.
packages = ["pgmask", "classify"]
# Build only the required packages, and individually
precise-builds = true
# Embed the crate graph in each ELF (`cargo audit bin`). Size cost is small;
# this is for the artifact, not only the checkout.
cargo-auditable = true
# cargo-dist 0.32.0's `cargo-cyclonedx = true` generates a Release step that
# never uploads the files (empty `steps.*.output.paths`) and a `find | mv`
# that GNU mv can refuse. Keep it off; extra-artifacts below go through
# dist's own checksum/manifest/upload path.

# CycloneDX SBOMs for the two shipped binaries. The script pins
# cargo-cyclonedx 0.5.9: dist 0.32 would have installed 0.5.5, which
# cannot parse Cargo.lock v4 and silently omits package hashes.
[[dist.extra-artifacts]]
artifacts = ["target/sbom/pgmask.cdx.xml", "target/sbom/classify.cdx.xml"]
build = ["./scripts/generate-sboms.sh"]

# Pin the same checkout action the rest of CI already uses.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
