[package]
name = "pgmask"
description = "Fail-closed column masking proxy for Postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "pgmask"
path = "src/lib.rs"

[[bin]]
name = "pgmask"
path = "src/main.rs"

[features]
# Exposes the extended-query state machine and its invariant oracle to the
# protocol fuzz target in `fuzz/`. Adds no dependencies — the oracle is plain
# Rust and the `Arbitrary` derive lives in the fuzz crate, which is its own
# workspace. Off by default, so neither the proxy binary nor `cargo build`
# compiles a line of it.
fuzzing = []

[dependencies]
anyhow.workspace = true
bytes.workspace = true
hmac.workspace = true
serde.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "signal"] }
tokio-postgres.workspace = true
toml.workspace = true
tokio-rustls.workspace = true
tokio-postgres-rustls.workspace = true
pg_query.workspace = true
jiff.workspace = true
rust_decimal.workspace = true
postgres-types.workspace = true
secrecy = { version = "0.10", features = ["serde"] }
arc-swap = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false, features = ["http-listener"] }
sqllineage = "0.2"
regex = "1.13.1"
iban_validate = "5.0.1"
rustls-pki-types = "1.15.1"
webpki-roots.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
proptest.workspace = true
pgwire = { version = "0.40", default-features = false }

[lints]
workspace = true
