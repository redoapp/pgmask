[package]
name = "fuzz"
description = "Replay generated SQL through pgmask and assert no masked value ever escapes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
jiff.workspace = true
tokio.workspace = true
tokio-postgres = { workspace = true, features = ["with-uuid-1", "with-jiff-0_2"] }
uuid = "1.24.0"
# `avg(int4)` is `numeric`, and a value the harness cannot decode is a value the
# oracle never scans. That is how the singleton-group disclosure stayed hidden:
# `sum(int4)` is `int8` and was being dropped before the detectors ran.
rust_decimal = { workspace = true, features = ["db-tokio-postgres"] }

[lints]
workspace = true
