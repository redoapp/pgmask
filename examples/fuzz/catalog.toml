listen = "127.0.0.1:6470"
backend = "127.0.0.1:55432"
catalog_dsn = "postgres://postgres:demo@localhost:55432/fuzzdb"
pseudonym_key = "fuzz-fixture-key"
unclassified = "mask"
unclassified_mask = "null"
opaque = "reject"
lineage = "allow"
catalog_refresh_seconds = 300

metrics_interval_seconds = 0

[[role]]
name = "support"
members = ["support_sam"]

[[role]]
name = "analyst"
members = ["analyst_ann"]

