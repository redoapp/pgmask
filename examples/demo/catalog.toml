listen = "127.0.0.1:6432"
backend = "127.0.0.1:55432"
catalog_dsn = "postgres://postgres:demo@localhost:55432/demo"

# Rotating this invalidates every pseudonym already handed out.
pseudonym_key = "demo-key-not-for-production"

# Default-deny: a column with provenance but no rule below is masked, not passed.
unclassified = "mask"
unclassified_mask = "null"

# A result set containing any field with no provenance is refused outright.
opaque = "reject"

# --- demo.customers ---------------------------------------------------------

[[column]]
relation = "demo.customers"
column = "email"
mask = "pseudonym"      # deterministic, keeps the domain, joins still work

[[column]]
relation = "demo.customers"
column = "name"
mask = "redact"

[[column]]
relation = "demo.customers"
column = "phone"
mask = "partial"        # keep the last 4

[[column]]
relation = "demo.customers"
column = "city"
mask = "none"           # explicitly allowed — a decision, not an omission

[[column]]
relation = "demo.customers"
column = "id"
mask = "none"

# demo.customers.internal_note is deliberately absent: default-deny nulls it.

# --- demo.customer_directory ------------------------------------------------
# Phase 0 finding: Postgres reports the VIEW's OID, not the base table's, so a
# view needs its own entries or every column in it reads as unclassified.

[[column]]
relation = "demo.customer_directory"
column = "id"
mask = "none"

[[column]]
relation = "demo.customer_directory"
column = "email"
mask = "pseudonym"

[[column]]
relation = "demo.customer_directory"
column = "name"
mask = "redact"

[[column]]
relation = "demo.customer_directory"
column = "city"
mask = "none"
