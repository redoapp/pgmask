  { pointer = "/phone_number", mask = "pseudonym", domain = "phone" },
]

# ---------------------------------------------------------------------------
# chatwoot.inboxes
# ---------------------------------------------------------------------------

[columns."chatwoot.inboxes"]
id = { mask = "none" }
channel_id = { mask = "none" }
account_id = { mask = "none" }
name = { mask = "none" }
email_address = { type = "email" }
greeting_enabled = { mask = "none" }
greeting_message = { mask = "redact" }
enable_email_collect = { mask = "none" }
csat_survey_enabled = { mask = "none" }
timezone = { mask = "none" }
selected_feature_flags = { mask = "none" }
lock_to_single_conversation = { mask = "none" }

[columns."chatwoot.inboxes".auto_assignment_config]
mask = "json"
json_unmatched = "type-placeholders"
json = [
  { pointer = "/max_assignment_limit", mask = "none" },
]

[columns."chatwoot.inboxes".csat_config]
mask = "json"
json_unmatched = "type-placeholders"
json = [
  { pointer = "/display_type", mask = "none" },
  # CSAT copy is tenant prose (same class as greeting_message), not an
  # ops enum. Parent/leaf `none` here forwarded planted emails.
  { pointer = "/message", mask = "redact" },
]

# ---------------------------------------------------------------------------
# chatwoot.contacts
# ---------------------------------------------------------------------------

[columns."chatwoot.contacts"]
id = { mask = "none" }
name = { type = "person_name" }
email = { type = "email" }
phone_number = { type = "phone" }
account_id = { mask = "none" }
identifier = { type = "external_id" }
last_activity_at = { mask = "none" }
contact_type = { mask = "none" }
middle_name = { type = "person_name" }
last_name = { type = "person_name" }
location = { mask = "none" }
country_code = { mask = "none" }
blocked = { mask = "none" }

# Custom attributes are tenant-defined. Public commerce keys are released;
# everything else keeps type without value until an operator adds a pointer.
[columns."chatwoot.contacts".custom_attributes]
mask = "json"
json_unmatched = "type-placeholders"
json = [
  { pointer = "/order_id", mask = "pseudonym", domain = "order_id" },
  { pointer = "/signed_up_at", mask = "none" },
  { pointer = "/ssn", mask = "redact" },
  { pointer = "/internal_notes", mask = "redact" },
]

# Widget / CRM blob written by the Chatwoot JS SDK and Contact model.
# Do not grant `/initiated_at` as `none`: that inherits to every future
# child. Timestamp is the ops key; nested PII stays unmatched.
[columns."chatwoot.contacts".additional_attributes]
mask = "json"
json_unmatched = "type-placeholders"
json = [
  { pointer = "/company_name", mask = "none" },
  { pointer = "/city", mask = "none" },
  { pointer = "/country", mask = "none" },
  { pointer = "/country_code", mask = "none" },
  { pointer = "/conversation_language", mask = "none" },
  { pointer = "/browser/browser_name", mask = "none" },
  { pointer = "/browser/browser_version", mask = "none" },
  { pointer = "/browser/os", mask = "none" },
  { pointer = "/browser/device_name", mask = "redact" },
  { pointer = "/initiated_at/timestamp", mask = "none" },
  { pointer = "/created_at_ip", mask = "ip-prefix" },
  { pointer = "/updated_at_ip", mask = "ip-prefix" },
  { pointer = "/referer", mask = "redact" },
  { pointer = "/social_profiles/twitter", mask = "redact" },
  { pointer = "/social_profiles/linkedin", mask = "redact" },
]

# ---------------------------------------------------------------------------
# chatwoot.conversations
# ---------------------------------------------------------------------------

[columns."chatwoot.conversations"]
id = { mask = "none" }
account_id = { mask = "none" }
inbox_id = { mask = "none" }
status = { mask = "none" }
assignee_id = { mask = "none" }
contact_id = { mask = "none" }
display_id = { mask = "none" }
contact_last_seen_at = { mask = "none" }
contact_inbox_id = { mask = "none" }
uuid = { type = "external_id" }
identifier = { type = "external_id" }
last_activity_at = { mask = "none" }
team_id = { mask = "none" }
campaign_id = { mask = "none" }
snoozed_until = { mask = "none" }
first_reply_created_at = { mask = "none" }
priority = { mask = "none" }
sla_policy_id = { mask = "none" }
# varchar[] is not a text-family mask target; null withholds the array
# without refusing SELECT * the way redact would.
label_list = { mask = "null" }

[columns."chatwoot.conversations".additional_attributes]
mask = "json"
json_unmatched = "type-placeholders"
json = [
  { pointer = "/browser/browser_name", mask = "none" },
  { pointer = "/browser/browser_version", mask = "none" },
  { pointer = "/browser/os", mask = "none" },
  { pointer = "/browser/device_name", mask = "redact" },
  { pointer = "/initiated_at/timestamp", mask = "none" },
  { pointer = "/browser_language", mask = "none" },
  { pointer = "/conversation_language", mask = "none" },
  { pointer = "/type", mask = "none" },
  # `/source` as `none` inherited into object-shaped values Chatwoot
  # does not always store as the channel enum string.
  { pointer = "/auto_reply", mask = "none" },
  { pointer = "/in_reply_to", mask = "redact" },
  { pointer = "/referer", mask = "redact" },
  { pointer = "/mail_subject", mask = "redact" },
]

[columns."chatwoot.conversations".custom_attributes]
mask = "json"
json_unmatched = "type-placeholders"
json = [
  { pointer = "/priority_reason", mask = "redact" },
  { pointer = "/stripe_charge", mask = "redact" },
]

# ---------------------------------------------------------------------------
# chatwoot.contact_inboxes
# ---------------------------------------------------------------------------

[columns."chatwoot.contact_inboxes"]
id = { mask = "none" }
contact_id = { mask = "none" }
inbox_id = { mask = "none" }
source_id = { type = "external_id" }
hmac_verified = { mask = "none" }
pubsub_token = { type = "secret_token" }

# ---------------------------------------------------------------------------
# chatwoot.messages
# content_attributes is json (OID 114) in Chatwoot, not jsonb.
# ---------------------------------------------------------------------------

[columns."chatwoot.messages"]
id = { mask = "none" }
# Transcript text can contain names, addresses, and secrets that a recogniser
# cannot identify reliably. Debug from metadata; do not release prose.
content = { mask = "redact" }
account_id = { mask = "none" }
inbox_id = { mask = "none" }
conversation_id = { mask = "none" }
message_type = { mask = "none" }
created_at = { mask = "none" }
updated_at = { mask = "none" }
private = { mask = "none" }
status = { mask = "none" }
source_id = { type = "external_id" }
content_type = { mask = "none" }
sender_type = { mask = "none" }
sender_id = { mask = "none" }
processed_message_content = { mask = "redact" }

[columns."chatwoot.messages".content_attributes]
mask = "json"
json_unmatched = "type-placeholders"
json = [
  { pointer = "/automation_rule_id", mask = "none" },
  { pointer = "/submitted_email", mask = "pseudonym", domain = "email" },
  { pointer = "/items/*/title", mask = "redact" },
  { pointer = "/items/*/value", mask = "redact" },
  # Pre-chat `name` is a field id in happy-path Chatwoot and an email or
  # nested object when the form is abused; `none` inherited either way.
  { pointer = "/items/*/name", mask = "redact" },
  { pointer = "/email/subject", mask = "redact" },
  { pointer = "/email/from", mask = "redact" },
  { pointer = "/email/message_id", mask = "redact" },
  { pointer = "/cc_emails", mask = "redact" },
]

[columns."chatwoot.messages".external_source_ids]
mask = "json"
json_unmatched = "type-placeholders"

[columns."chatwoot.messages".additional_attributes]
mask = "json"
json_unmatched = "type-placeholders"
json = [
  { pointer = "/campaign_id", mask = "none" },
]

[columns."chatwoot.messages".sentiment]
mask = "json"
json_unmatched = "type-placeholders"
json = [
  { pointer = "/label", mask = "none" },
  { pointer = "/score", mask = "none" },
]

# ---------------------------------------------------------------------------
# chatwoot.automation_rules
# ---------------------------------------------------------------------------

[columns."chatwoot.automation_rules"]
id = { mask = "none" }
account_id = { mask = "none" }
name = { mask = "redact" }
description = { mask = "redact" }
event_name = { mask = "none" }
active = { mask = "none" }

[columns."chatwoot.automation_rules".conditions]
mask = "json"
json_unmatched = "type-placeholders"
json = [
  { pointer = "/*/attribute_key", mask = "none" },
  { pointer = "/*/query_operator", mask = "none" },
  { pointer = "/*/filter_operator", mask = "none" },
  { pointer = "/*/custom_attribute_type", mask = "none" },
  { pointer = "/*/values/*", mask = "redact" },
]

[columns."chatwoot.automation_rules".actions]
mask = "json"
json_unmatched = "type-placeholders"
# action_params hold send_message prose, emails, and labels. action_name
# is the ops diagnostic; params are customer-controlled.
json = [
  { pointer = "/*/action_name", mask = "none" },
  { pointer = "/*/action_params/*", mask = "redact" },
]

