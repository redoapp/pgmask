# Operator catalog for the Chatwoot golden fixture.
#
# Relations and JSON keys are taken from Chatwoot's schema and models
# (see SOURCES.md). This is a *policy* a support-engineering team might
# actually write: keep the ops shape of widget/session JSON, mask PII
# leaves, and fail closed on anything unclassified.
#
# `verify.sh` rewrites listen/backend/catalog_dsn to the Postgres it started.

listen = "127.0.0.1:16432"
backend = "127.0.0.1:55433"
catalog_dsn = "postgres://postgres@127.0.0.1:55433/chatwoot_golden"

pseudonym_key = "chatwoot-golden-not-for-production"

unclassified = "mask"
opaque = "reject"
# This corpus is specifically for debugging without using predicates as a
# character-by-character oracle over masked values. Released operational keys
# remain filterable; masked PII in WHERE / ORDER BY / GROUP BY refuses.
posture = "hostile"

catalog_refresh_seconds = 30

[[semantic_type]]
name = "email"
mask = "pseudonym"

[[semantic_type]]
name = "person_name"
mask = "redact"

[[semantic_type]]
name = "phone"
mask = "pseudonym"

[[semantic_type]]
name = "ip_address"
mask = "ip-prefix"

[[semantic_type]]
name = "secret_token"
mask = "null"

[[semantic_type]]
name = "external_id"
mask = "pseudonym"

[[semantic_type]]
name = "order_id"
mask = "pseudonym"

# ---------------------------------------------------------------------------
# chatwoot.accounts
# ---------------------------------------------------------------------------

[columns."chatwoot.accounts"]
id = { mask = "none" }
name = { mask = "none" }
locale = { mask = "none" }
domain = { mask = "redact" }
support_email = { type = "email" }
feature_flags = { mask = "none" }
status = { mask = "none" }

[columns."chatwoot.accounts".settings]
mask = "json"
json_unmatched = "type-placeholders"
json = [
  { pointer = "/auto_resolve_after", mask = "none" },
  { pointer = "/audio_transcriptions", mask = "none" },
  { pointer = "/auto_resolve_ignore_waiting", mask = "none" },
]

[columns."chatwoot.accounts".custom_attributes]
mask = "json"
json_unmatched = "type-placeholders"
json = [
  { pointer = "/industry", mask = "none" },
  { pointer = "/plan", mask = "none" },
]

[columns."chatwoot.accounts".limits]
mask = "json"
json_unmatched = "type-placeholders"
json = [
  { pointer = "/agents", mask = "none" },
  { pointer = "/inboxes", mask = "none" },
]

# Billing identifiers live here in real Chatwoot installs.
[columns."chatwoot.accounts".internal_attributes]
mask = "json"
json_unmatched = "type-placeholders"
json = [
  { pointer = "/onboarding_step", mask = "none" },
  { pointer = "/stripe_customer_id", mask = "redact" },
]

