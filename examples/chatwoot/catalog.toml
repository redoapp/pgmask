  { pointer = "/in_reply_to", mask = "none" },
  { pointer = "/submitted_email", mask = "pseudonym", domain = "email" },
  { pointer = "/items/*/title", mask = "redact" },
  { pointer = "/items/*/value", mask = "redact" },
  { pointer = "/items/*/name", mask = "none" },
  { pointer = "/email/subject", mask = "redact" },
