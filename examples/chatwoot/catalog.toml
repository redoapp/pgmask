column = "updated_at"
mask = "none"

[[column]]
relation = "chatwoot.messages"
column = "private"
mask = "none"

[[column]]
relation = "chatwoot.messages"
column = "status"
mask = "none"

[[column]]
relation = "chatwoot.messages"
column = "source_id"
type = "external_id"

[[column]]
relation = "chatwoot.messages"
column = "content_type"
mask = "none"

[[column]]
