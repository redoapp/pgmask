# `cargo audit` reads Cargo.lock, which lists packages that are resolved but not
# necessarily compiled. Anything ignored here must be justified by evidence, not
# by convenience — the point of running the audit is to be told things.

[advisories]
ignore = [
    # RUSTSEC-2026-0235, rkyv 0.7.46: out-of-bounds reads on malformed archives.
    #
    # Not reachable. rkyv is an *optional* feature dependency of rust_decimal
    # and we do not enable it, so it appears in Cargo.lock and is never built.
    # Verified rather than assumed: `cargo tree -i rkyv` reports nothing, and
    # after a full `cargo build --release` there are zero rkyv artifacts in
    # target/release/deps.
    #
    # Re-check when rust_decimal is bumped: if the feature ever becomes
    # default-on, this ignore silently starts hiding a real finding.
    "RUSTSEC-2026-0235",
]
